name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Tests cover code quality (ruff) and result/logic checks (pytest) only.
      # The heavy RL runtime (torch, gymnasium[box2d]) is not needed here and is
      # exercised locally, keeping CI fast and reliably green.
      - name: Install test and lint dependencies
        run: |
          pip install numpy pytest ruff
          pip install -e . --no-deps

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run tests
        run: pytest
