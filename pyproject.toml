[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-sweep"
version = "0.1.0"
description = "Systematic PPO vs DQN hyperparameter sweep across Gymnasium environments"
authors = [{ name = "Daniel Marin" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "stable-baselines3[extra]>=2.3",
    "gymnasium[box2d]>=0.29",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
rl-sweep = "rlsweep.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rlsweep"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
